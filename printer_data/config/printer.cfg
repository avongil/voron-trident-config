[include fluidd.cfg]
# This file contains common pin mappings for the BigTreeTech Octopus V1.
# To use this config, the firmware should be compiled for the STM32F446 with a "32KiB bootloader"
# Enable "extra low-level configuration options" and select the "12MHz crystal" as clock reference

# after running "make", copy the generated "klipper/out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the OctoPus with that SD card.

# See docs/Config_Reference.md for a description of parameters.

## Voron Design Trident 250/300/350mm BigTreeTech OctoPus V1 TMC2209 UART config

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths                            [mcu] section
## Thermistor types                     [extruder] and [heater_bed] sections - See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types
## Leadscrew Rotation Distance          [stepper_z], [stepper_z1], [stepper_z2]
## Z Endstop Switch location            [safe_z_home] section
## Z Endstop Switch  offset for Z0      [stepper_z] section
## PID tune                             [extruder] and [heater_bed] sections
## Probe pin                            [probe] section
## Fine tune E steps                    [extruder] section

#[include mainsail.cfg]
[include stealthburner_leds.cfg]
[include purge_line.cfg]
[include nozzle_scrub.cfg]
[include bedfans.cfg]
[include toolhead_btt_ebbcan_G0B1_v1.2.cfg]
#[include usb_adxl.cfg] # Uncomment this for input shaper tuning

[mcu]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_1F003D00115053424E363620-if00
restart_method: command


#--------------------------Printer--------------------------
[printer]
kinematics: corexy
max_velocity: 600
max_accel: 4500             #Max 4000
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 100
square_corner_velocity: 5.0
minimum_cruise_ratio: 0.5

#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop connected to DIAG_0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 39.80569
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: PG6
position_min: 0
##--------------------------------------------------------------------

##  Uncomment below for 250mm build
position_endstop: 250
position_max: 250


##--------------------------------------------------------------------
homing_speed: 35   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_x]
uart_pin: PC4
interpolate: False
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 0

##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to DIAG_1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 39.75381
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: PG9
position_min: 0
##--------------------------------------------------------------------

##  Uncomment for 250mm build
position_endstop: 255
position_max: 257 # 257 is max! 258 hits hard stop

##--------------------------------------------------------------------
homing_speed: 35  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_y]
uart_pin: PD11
interpolate: False
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Z Stepper Settings
#####################################################################

##  Z0 Stepper - Front Left
##  Connected to MOTOR_2
##  Endstop connected to DIAG_2
[stepper_z]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
# Rotation Distance for TR8x8 = 8, TR8x4 = 4, TR8x2 = 2
rotation_distance: 4
microsteps: 32
###endstop_pin: PG10
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0
#endstop_pin: probe:z_virtual_endstop  # for klicky as virtual endstop. Must comment out enstop_pin and position_endstop.
##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##  Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config

### BUILD PLATE SELECT WITH ENDSTOP ADJUSTMENT

#position_endstop = 0
#position_endstop = -1.250 #voron textured build plate
#position_endstop = -1.300 # Kobra textured build plate
#position_endstop = -1.650 # micro texture build plate

## All builds use same Max Z
position_max: 250
position_min: -5.0
homing_speed: 8. # Leadscrews are slower than 2.4, 10 is a recommended max.
second_homing_speed: 2.0
#homing_retract_dist: 5.0

##  Make sure to update below for your relevant driver (2208 or 2209)

[mcu cartographer] # See https://www.klipper3d.org/Config_Reference.html#mcu
# Remove either the serial or canbus_uuid line dependant on your setup.
canbus_uuid: dd25ab1f879f

[cartographer]
mcu: cartographer
x_offset: 0 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
y_offset: 22.1 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
verbose: yes # For extra output


[tmc2209 stepper_z]
uart_pin: PC6
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z1 Stepper - Rear Center
##  Connected to MOTOR_3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
# Rotation Distance for TR8x8 = 8, TR8x4 = 4, TR8x2 = 2
rotation_distance: 4
microsteps: 32

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z2 Stepper - Front Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
# Rotation Distance for TR8x8 = 8, TR8x4 = 4, TR8x2 = 2
rotation_distance: 4
microsteps: 32


##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z2]
uart_pin: PF2 #Connected to Motor_4
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   BTT Smart Filament Sensor 2.0
#####################################################################

[filament_switch_sensor switch_sensor]
switch_pin: ^PG12
pause_on_runout: False
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament switch runout
insert_gcode:
  M117 Filament switch inserted

[filament_motion_sensor encoder_sensor]
switch_pin: ^PG13
detection_length: 50
extruder: extruder
pause_on_runout: False
event_delay: 3.0
pause_delay: 1.5 #0.5
runout_gcode:
    {% if printer.print_stats.state == "printing" %}
        PAUSE
        M117 Filament encoder runout
    {% endif %}
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament encoder runout
insert_gcode:
  M117 Filament encoder inserted

[delayed_gcode DISABLEFILAMENTSENSOR] ; This will disable the SFS 1 second after klipper starts
initial_duration: 1
gcode:
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0

[gcode_macro SFS_ENABLE] ; Add this to PRINT_START to start the sensor right away
description: Enable smart filament sensor
gcode:
    M117 ENABLING the Smart Filament Sensor
    G92 E0
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1 ; Put your filament sensor's name after SENSOR=

[gcode_macro SFS_DISABLE] ; Add this to PRINT_END and PRINT_CANCEL to disable the sensor right away
description: Disable smart filament sensor
gcode:
    M117 DISABLING the Smart Filament Sensor
    G92 E0
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0 ; Put your filament sensor's name after SENSOR=


#####################################################################
#--------------------------Emergency Stop--------------------------__
[gcode_button emergency_stop]
pin: ^PG14
debounce_delay: 0.050
press_gcode:
    {action_emergency_stop("Emergency stop button pressed")}

#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
##  SSR Pin - HE1
##  Thermistor - TB
heater_pin: PA3
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for Keenovo heaters
sensor_type: Generic 3950
sensor_pin: PF3
##  Adjust Max Power so your heater doesn't warp your bed. Rule of thumb is 0.4 watts / cm^2 .  - not applicable to cast aluminum bed.
max_power: 1.0
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

#####################################################################
#   Chamber Thermistor
#####################################################################

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PF5
min_temp: 0
max_temp: 100
gcode_id: C


[bed_mesh]
speed: 300
horizontal_move_z: 3
##--------------------------------------------------------------------
##	Uncomment below for 250mm build
##mesh_min: 40, 40
##mesh_max: 210,210
mesh_min: 30, 30
mesh_max: 220,220
##--------------------------------------------------------------------
#fade_start: 0.6
#fade_end: 10.0
probe_count: 20, 20
adaptive_margin: 10
mesh_pps: 0,0 # Disable interpolation - mesh is probably dense enough
algorithm: bicubic
#relative_reference_index: 40   DEPRECIATED
zero_reference_position: 125, 125
#move_check_distance: 3
#split_delta_z: 0.0125

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

[adxl345]
# Select 1 of the cs_pin below depending on the probe you have.
# Having the wrong one selected will cause an Endless Bootloop
# Cartographer V4 has int2 connected to the probes PA1 pin
cs_pin: cartographer:PA3 # For Cartographer V3
#cs_pin: cartographer:PA0 # For Cartographer V4
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
    125, 125, 20 # Fill out the blank with x and y coordinates where you want to run the resonance test.

#####################################################################
#   Fan Control
#####################################################################

# Hot end fan and part cooling fan are in BTT36

[controller_fan controller_fan]
##  Controller fan - FAN2
pin: PD12
kick_start_time: 0.5
max_power: 0.2
heater: heater_bed


[fan_generic Nevermore]
pin:PD13
max_power:1.0
shutdown_speed: 0.0

# Moved to bedfans.cfg
#[fan_generic bed_fan]
#pin:PD15
#max_power:1.0
#shutdown_speed: 0.0

#[fan_generic exhaust_fan]
#pin:PD14
#max_power:1.0
#shutdown_speed: 0.0


#[temperature_sensor chamber_2]
#sensor_type: PT1000 #Generic 3950
#sensor_pin: PF7
#min_temp: 0
#max_temp: 100
#gcode_id: D

[temperature_fan chamberfan]
pin: PD14
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
cycle_time:0.01
off_below:0.1
sensor_type: PT1000
sensor_pin: PF7
min_temp: 0
max_temp: 70
target_temp: 55.0
control: watermark
gcode_id: D

#Add another section with a new macro.

#[gcode_macro M141]
#gcode:
   #{% set s = params.S|default(0)|float %}
   # SET_TEMPERATURE_FAN_TARGET temperature_fan="chamberfan" target={s}




#   See the "fan" section for a description of the above parameters.

#####################################################################
#   LED Control
#####################################################################

#[output_pin caselight]
# Chamber Lighting - HE2 Connector (Optional)
#pin: PB10
#pwm:true
#shutdown_value: 0
#value:1
#cycle_time: 0.01

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

[safe_z_home]
home_xy_position: 125, 125 # This should be for the CENTRE OF YOUR BED.
speed:100
z_hop:10

[z_tilt]
##  Use Z_TILT_ADJUST to level the bed .
##  z_positions: Location of toolhead

##--------------------------------------------------------------------
## Uncomment below for 250mm build
z_positions:
    -50, 18
    125, 298
    300, 18
points:
    30, 5
    125, 195
    220, 5

##--------------------------------------------------------------------

speed: 200
horizontal_move_z: 10
retries: 3
retry_tolerance: 0.02



#####################################################################
#   Macros
#####################################################################

[skew_correction]


[gcode_macro _PRINT_VARS]
# Stores print session variables that need to survive TURN_OFF_HEATERS
variable_chamber_target: 55
gcode:
    # intentionally empty

[gcode_macro PRINT_START]
gcode:


    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
    {% set CHAMBER_TEMP_MIN = params.CHAMBER_TEMP_MIN|default(32)|float %}
    {% set CHAMBER_TEMP_MAX = params.CHAMBER_TEMP|default(55)|float %}
     {% set PROBINGTOUCHTEMP = 120 %}
     {% set PROBINGTOUCHTEMPPLUS = PROBINGTOUCHTEMP+5 %}
     {% set PROBINGTOUCHTEMPMINUS = PROBINGTOUCHTEMP-5 %}
     {% set saved_clean_nozzle = printer.save_variables.variables.clean_nozzle|default(0)|int %}
     {% set do_clean_nozzle = params.CLEAN_NOZZLE|default(saved_clean_nozzle)|int %}   # driven by TOGGLE_NOZZLE_CLEAN button; slicer param overrides if passed

    SET_GCODE_OFFSET Z=0                                 # Set offset to 0
    STATUS_HOMING ; Cyan logo and white nozzle
    G28
    G90

    BED_MESH_CLEAR                                       # Clear old saved bed mesh (if any)

    #SKEW_PROFILE LOAD=Skew1


    ### controlled cooling of the chamber

    SET_DISPLAY_TEXT MSG="CHAMBER TARGET TEMP: {CHAMBER_TEMP_MAX}C"
    SET_TEMPERATURE_FAN_TARGET temperature_fan="chamberfan" target={CHAMBER_TEMP_MAX}
    SET_GCODE_VARIABLE MACRO=_PRINT_VARS VARIABLE=chamber_target VALUE={CHAMBER_TEMP_MAX}  ; save for use in PRINT_END
    ###

         ### Controlled Heating
    SET_FAN_SPEED FAN=Nevermore SPEED=.5

    G0 X125 Y125 Z30 F3600          # Move to safe center position

    # Pre-heat hotend to probing temperature (non-blocking + tolerance)
    SET_DISPLAY_TEXT MSG="Heating Hot End: {PROBINGTOUCHTEMP}C"
    M104 S{PROBINGTOUCHTEMP}                       # Set target extruder temp but do NOT wait

    # Start bed heating (unchanged)
    SET_DISPLAY_TEXT MSG="Heating Bed: {BED_TEMP}C"
    M190 S{BED_TEMP}                # Wait for bed (still blocking; adjust PID if needed)

    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={PROBINGTOUCHTEMPMINUS}   # Proceed once within +- ~5 °C tolerance - just in case bed was hot.
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={PROBINGTOUCHTEMPPLUS}

    ## Set and wait for chamber to reach temperature
    SET_DISPLAY_TEXT MSG="Heatsoak: {CHAMBER_TEMP_MIN}C"
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={CHAMBER_TEMP_MIN}
    ### end Controlled Heating

    SET_DISPLAY_TEXT MSG="Z Tilt Leveling"
    STATUS_LEVELING ; Pink logo and white nozzle
    Z_TILT_ADJUST # z_tilt with a dirty nozzle
    G28 Z                                                # Home Z again after Z_TILT_ADJUST

    G90                            ; absolute positioning

    SET_DISPLAY_TEXT MSG="Bed mesh"                      # Display info on display
    STATUS_MESHING                                       # Set LEDs to bed mesh-mode
    BED_MESH_CALIBRATE                                   # Start the bed mesh (add ADAPTIVE=1) for adaptive bed mesh


     # Nozzle Cleaning
    {% if do_clean_nozzle %}
    SET_DISPLAY_TEXT MSG="Heating Hot End: 240C"
    M104 S245                       # Set target but do NOT wait
    G0X240.Y245.
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=240   # Proceed once within ~5 °C tolerance.

    M117 Cleaning nozzle
    STATUS_CLEANING
    CLEAN_NOZZLE
    {% else %}
    M117 Skipping nozzle clean
    {% endif %}
    # End Nozzle Cleaning


    M104 S{PROBINGTOUCHTEMP}                       # Set target but do NOT wait
    SET_DISPLAY_TEXT MSG="Heating Hot End: {PROBINGTOUCHTEMP}"
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={PROBINGTOUCHTEMPPLUS}   # Proceed once within ~5 °C tolerance - just in case bed was hot.
    M106 S0

    SET_DISPLAY_TEXT MSG="Cartographer Touch Z"
    CARTOGRAPHER_TOUCH_HOME # Calibrate z offset only with hot nozzle



    M140 S{BED_TEMP} # heat bed, do not wait.
        SET_DISPLAY_TEXT MSG="Heating Hot End: {EXTRUDER_TEMP}C"
    M109 S{ EXTRUDER_TEMP }  ; Wait for nozzle to get to target temperature.
        SET_DISPLAY_TEXT MSG="Heating Bed: {BED_TEMP}C"
    M190 S{BED_TEMP}


   # G28 Z

    STATUS_PRINTING
    SET_FAN_SPEED FAN=Nevermore SPEED=.25
    M117 Purging
    PURGE_LINE
    #Enable Fillament sensor  -  changed so it enables after the first layer.
    #SFS_ENABLE
    M117 PRINTING


#--------------------------------------------------------------------

[save_variables]
# Adjust this path if your install uses a different config directory
# (e.g. /home/pi/klipper_config/variables.cfg on older installs).
filename: ~/printer_data/config/variables.cfg

[gcode_macro TOGGLE_NOZZLE_CLEAN]
description: Toggle whether PRINT_START runs the nozzle scrub - persists across restarts, shows as a button in Fluidd's Macros panel
gcode:
    {% set current = printer.save_variables.variables.clean_nozzle|default(0)|int %}
    {% set new_val = 0 if current else 1 %}
    SAVE_VARIABLE VARIABLE=clean_nozzle VALUE={new_val}
    {% if new_val %}
        RESPOND MSG="Nozzle clean: ON (will scrub at next PRINT_START)"
        M117 Nozzle clean: ON
    {% else %}
        RESPOND MSG="Nozzle clean: OFF (will skip scrub at next PRINT_START)"
        M117 Nozzle clean: OFF
    {% endif %}

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    SFS_DISABLE
    SET_FAN_SPEED FAN=Nevermore SPEED=1.0
    SET_DISPLAY_TEXT MSG="CHAMBER AIR FILTERING"

    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 12, th.axis_maximum.z]|min %}
    {% set cooldown_target = printer["gcode_macro _PRINT_VARS"].chamber_target - 5|default(50)|float %}  ; read saved target - immune to TURN_OFF_HEATERS

    SET_SKEW CLEAR=1
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-2.0 F3600                 ; retract filament

    TURN_OFF_HEATERS

    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan

    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END

    G4 P60000                      ; Dwell 1 min so Nevermore can filter chamber air then turn on the exhaust fan

    # === Cooldown logic ===
    # Capture chamberfan target set in PRINT_START minus 5 °C.
    SET_DISPLAY_TEXT MSG="COOLDOWN CHAMBER TARGET TEMP: {cooldown_target}C"
    SET_TEMPERATURE_FAN_TARGET temperature_fan="chamberfan" target={cooldown_target}

    SET_FAN_SPEED FAN=Nevermore SPEED=0
    #SET_FAN_SPEED FAN=exhaust_fan SPEED=0 #not used anymore

#####################################################################
#   Cancel Print - raise Z 50mm, or home Z if that would over-travel
#####################################################################
# There was no explicit CANCEL_PRINT override in this config, so this
# renames whatever fluidd.cfg provides (CANCEL_PRINT_BASE) and runs it
# first, then does the Z move/home on top of it.

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    CANCEL_PRINT_BASE
    {% set current_z = printer.toolhead.position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% if current_z + 50 <= max_z %}
        G91                          ; relative positioning
        G1 Z50 F900                  ; raise Z 50mm (900mm/min = configured max_z_velocity)
        G90                          ; absolute positioning
    {% else %}
        G28 Z                       ; not enough headroom, home Z instead
    {% endif %}

#####################################################################
#   Go to Maintenance position Macro
#####################################################################

[gcode_macro MAINT_POS]
  gcode:
        G0X125.Y0.Z240.

#####################################################################
#   Pause and Resume Macros for BTT fillament sensor
#####################################################################


[pause_resume]
recover_velocity: 50.
#   When capture/restore is enabled, the speed at which to return to
#   the captured position (in mm/s). Default is 50.0 mm/s.

[gcode_macro M600] ;Enables compatibility with default M600 filament change macro in some slicers
gcode:
    PAUSE  ; Calls the PAUSE macro

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # Parameters
    {% set z = params.Z|default(10)|int %}                                                   ; z hop amount

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                              ; set z hop variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}    ; set hotend temp variable for reference in resume macro

        SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0                                  ; disable filament sensor
        SAVE_GCODE_STATE NAME=PAUSE                                                          ; save current print position for resume
        BASE_PAUSE                                                                           ; pause print
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}       ; check that zhop doesn't exceed z max
            G91                                                                              ; relative positioning
            G1 Z{z} F900                                                                     ; raise Z up by z hop amount
        {% else %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }                  ; if z max is exceeded, show message and set zhop value for resume to 0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90                                                                                  ; absolute positioning
        G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} F6000   ; park toolhead at front center
        SAVE_GCODE_STATE NAME=PAUSEPARK                                                      ; save parked position in case toolhead is moved during the pause (otherwise the return zhop can error)
        M104 S0                                                                              ; turn off hotend
        SET_IDLE_TIMEOUT TIMEOUT=43200                                                       ; set timeout to 12 hours
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    # Parameters
    {% set e = params.E|default(2.5)|int %}

    {% if printer['pause_resume'].is_paused|int == 1 %}
        SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1                           ; enable filament sensor
        #RESETRGB                                                                    ; reset LCD color
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}  ; set timeout back to configured value
        {% if etemp > 0 %}
            M109 S{etemp|int}                                                        ; wait for hotend to heat back up
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                     ; go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)
        G91                                                                          ; relative positioning
        M83                                                                          ; relative extruder positioning
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            G1 Z{zhop * -1} E{e} F900                                                ; prime nozzle by E, lower Z back down
        {% else %}
            G1 Z{zhop * -1} F900                                                     ; lower Z back down without priming (just in case we are testing the macro with cold hotend)
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                          ; restore position
        BASE_RESUME                                                                  ; resume print
    {% endif %}   ; Pause






######################################################################
# Pause Resume Macros for Multi Material Macros
######################################################################
[gcode_macro M900]
gcode:
    #default_parameter_K: 0 gcode : SET_PRESSURE_ADVANCE ADVANCE={K}

[gcode_macro T0]
gcode:
    ACTIVATE_EXTRUDER EXTRUDER=extruder


[gcode_macro T1]
gcode:
    ACTIVATE_EXTRUDER EXTRUDER=extruder

[gcode_macro SWAP_RESUME]
gcode:
    {% set X = params.X|default(125)|float %}   # move x to position 50?
    {% set Y = params.Y|default(0)|float %}     # move y to position 0?
    {% set Z = params.Z|default(10)|float %}  # move z up incremental by 10
    SAVE_GCODE_STATE NAME=M600_state   # save the state of the print?
    PAUSE
    G91                                  #set coordinates to relative
    G1 E-.8 F2700                 # retract -.8 mm
    G1 Z{Z}                            # move to the defined z pos
    G90                                  # set coordinates to absolute
    G1 X{X} Y{Y} F3000        # move x/y to defined pos' @ 3000m/s
    G91                                  # set coordinates to relative
    G1 E-50 F1000             # retract -125mm
    RESTORE_GCODE_STATE NAME=M600_state        #resume the print


[gcode_macro LOAD_FILAMENT]
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity %}
    SAVE_GCODE_STATE NAME=load_state
    ##M300 # beep
    G91
    G92 E0
    G1 E60 F{max_velocity} # fast-load
    G1 E50 F{speed} # purge
    ##M300
    ##M300
    RESTORE_GCODE_STATE NAME=load_state



[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity %}
    SAVE_GCODE_STATE NAME=unload_state
    G91
    ##M300 # beep
    G92 E0
    G1 E5 F{speed} # purge
    G1 E-100 F{max_velocity} # fast-unload
    ##M300
    ##M300
    RESTORE_GCODE_STATE NAME=unload_state

