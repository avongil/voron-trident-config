############### Config options ##################

[gcode_macro _BEDFANVARS]
variable_bed_threshold: 80
variable_chamber_target_min: 40
variable_fast: 0.60
variable_med: 0.40
variable_slow: 0.20
gcode:

########## Bed Fans #########

[fan_generic BedFans]
pin: PD15
max_power: 1.0
kick_start_time: 0.5

########## Aliases #########

[gcode_macro BEDFANSSLOW]
gcode:
    {% set SLOW = printer["gcode_macro _BEDFANVARS"].slow|float %}
    SET_FAN_SPEED FAN=BedFans SPEED={SLOW}

[gcode_macro BEDFANSFAST]
gcode:
    {% set FAST = printer["gcode_macro _BEDFANVARS"].fast|float %}
    SET_FAN_SPEED FAN=BedFans SPEED={FAST}

[gcode_macro BEDFANSMED]
gcode:
    {% set MED = printer["gcode_macro _BEDFANVARS"].med|float %}
    SET_FAN_SPEED FAN=BedFans SPEED={MED}

[gcode_macro BEDFANSOFF]
gcode:
    SET_FAN_SPEED FAN=BedFans SPEED=0

############ Command overrides ############

[gcode_macro SET_HEATER_TEMPERATURE]
rename_existing: _SET_HEATER_TEMPERATURE
gcode:
    {% set HEATER = params.HEATER|default("None")|string|lower %}
    {% set TARGET = params.TARGET|default(0)|float %}

    {% if HEATER == "extruder" %}
        M104 S{TARGET}
    {% elif HEATER == "heater_bed" %}
        M99140 S{TARGET}
    {% else %}
        {action_respond_info("Heater %s not supported" % HEATER)}
    {% endif %}

    {% set BED_THRESHOLD = printer["gcode_macro _BEDFANVARS"].bed_threshold|int %}
    {% if HEATER == "heater_bed" and TARGET >= BED_THRESHOLD %}
        BEDFANSSLOW
        UPDATE_DELAYED_GCODE ID=bedfanloop DURATION=2
    {% endif %}

[gcode_macro M140]
rename_existing: M99140
description: Set bed temperature (non-blocking) - does NOT wait for temp, that's M190's job
gcode:
    {% set S = params.S|float %}
    {% set BED_THRESHOLD = printer["gcode_macro _BEDFANVARS"].bed_threshold|int %}

    {% if S >= BED_THRESHOLD %}
        BEDFANSSLOW
        UPDATE_DELAYED_GCODE ID=bedfanloop DURATION=2
    {% else %}
        BEDFANSOFF
    {% endif %}

    M99140 S{S}
    # No TEMPERATURE_WAIT here - M140 must stay non-blocking, otherwise a plain
    # M140 (e.g. a slicer's "drop bed temp after first layer" step) will stall
    # the print for however long it takes the bed to settle into range.

[gcode_macro M190]
rename_existing: M99190
gcode:
    {% set S = params.S|float %}
    {% set BED_THRESHOLD = printer["gcode_macro _BEDFANVARS"].bed_threshold|int %}

    {% if S >= BED_THRESHOLD %}
        BEDFANSSLOW
        UPDATE_DELAYED_GCODE ID=bedfanloop DURATION=2
    {% else %}
        BEDFANSOFF
    {% endif %}

    M99190 S{S}

    {% if S > 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={S} MAXIMUM={S + 5}
    {% endif %}

# Improved TURN_OFF_HEATERS - cancels loop + forces fans off
[gcode_macro TURN_OFF_HEATERS]
rename_existing: _TURN_OFF_HEATERS
gcode:
    BEDFANSOFF
    _TURN_OFF_HEATERS

################ Chamber Monitoring Loop (Ramp-Up) #####################

[delayed_gcode bedfanloop]
gcode:
    {% set BED_THRESHOLD = printer["gcode_macro _BEDFANVARS"].bed_threshold|int %}
    {% set CHAMBER_MIN = printer["gcode_macro _BEDFANVARS"].chamber_target_min|int %}

    {% set chamber_temp = printer["temperature_sensor chamber"].temperature|default(0)|float %}
    {% set chamber_target = printer["temperature_fan chamberfan"].target|default(CHAMBER_MIN)|float %}

    # Only run if bed heater is still active
    {% if printer.heater_bed.target > 30 %}
              {action_respond_info("Bed Target > 30")}

        {% if chamber_temp < (chamber_target - 4) %}

            {% if printer.heater_bed.temperature >= (printer.heater_bed.target * 0.75) %}
                 {action_respond_info("Target_Loop_Fast → Chamber: %.1f/%.1f°C | Bed: %.1f/%.1f°C" % (chamber_temp, chamber_target, printer.heater_bed.temperature, printer.heater_bed.target))}
                BEDFANSFAST
            {% elif printer.heater_bed.temperature >= (printer.heater_bed.target * 0.50) %}
                {action_respond_info("Target_Loop_Med → Chamber: %.1f/%.1f°C | Bed: %.1f/%.1f°C" % (chamber_temp, chamber_target, printer.heater_bed.temperature, printer.heater_bed.target))}
                BEDFANSMED
            {% else %}
                {action_respond_info("Target_Loop_Slow → Chamber: %.1f/%.1f°C | Bed: %.1f/%.1f°C" % (chamber_temp, chamber_target, printer.heater_bed.temperature, printer.heater_bed.target))}
                BEDFANSSLOW
            {% endif %}

            UPDATE_DELAYED_GCODE ID=bedfanloop DURATION=3
            {action_respond_info("BedFanLoop → Chamber: %.1f/%.1f°C | Bed: %.1f/%.1f°C" % (chamber_temp, chamber_target, printer.heater_bed.temperature, printer.heater_bed.target))}

        {% else %}
            BEDFANSOFF
            {action_respond_info("Chamber heat-soak complete - BedFans OFF Loop 1")}
        {% endif %}

    {% else %}
        BEDFANSOFF
        {action_respond_info("Chamber heat-soak complete - BedFans OFF Loop 2")}
    {% endif %}
