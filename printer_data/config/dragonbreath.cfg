# DragonBreath chamber heater (Panda Breath running DragonBreath firmware)
# Helper: ~/dragonbreath-klipper (symlinked into ~/klipper/klippy/extras)
# Device UI: http://192.168.101.83/

[dragonbreath]
host: 192.168.101.83
#port: 80
#token: web              # set to the device control token if you ever set one
#poll_interval: 2.0
register_macros: False   # M141/M191 defined below (M191 with release tolerance)

[heater_generic dragonbreath]
heater_pin: dragonbreath:pwm
sensor_type: dragonbreath
control: watermark
max_delta: 2.0
min_temp: 0
max_temp: 75             # firmware hard-caps the target at 70 C

[verify_heater dragonbreath]
check_gain_time: 300     # PTC chamber heaters are slow
hysteresis: 5
heating_gain: 1

# Fan-only filtration (blower is on/off only). SET_PIN PIN=dragonbreath_filter VALUE=1|0
[output_pin dragonbreath_filter]
pin: dragonbreath:filter

[gcode_macro M141]
description: Set Chamber Temperature (S0 = off)
gcode:
    {% set s = params.S|default(0)|float %}
    SET_HEATER_TEMPERATURE HEATER="dragonbreath" TARGET={s}

[gcode_macro M191]
description: Set chamber temp and wait (R = release temp, default S-5)
gcode:
    {% set s = params.S|default(0)|float %}
    {% set r = params.R|default(0)|float %}
    {% if r <= 0 %}{% set r = s - 5 %}{% endif %}
    {% set r = [r, s]|min %}
    M141 S{s}
    {% if s > 0 %}
        TEMPERATURE_WAIT SENSOR="heater_generic dragonbreath" MINIMUM={r}
    {% endif %}
