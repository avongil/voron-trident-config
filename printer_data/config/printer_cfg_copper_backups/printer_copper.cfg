[include fluidd.cfg]
# This file contains common pin mappings for the BigTreeTech Octopus V1.
# To use this config, the firmware should be compiled for the STM32F446 with a "32KiB bootloader"
# Enable "extra low-level configuration options" and select the "12MHz crystal" as clock reference

# after running "make", copy the generated "klipper/out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the OctoPus with that SD card.

# See docs/Config_Reference.md for a description of parameters.

## Voron Design Trident 250/300/350mm BigTreeTech OctoPus V1 TMC2209 UART config

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths                            [mcu] section
## Thermistor types                     [extruder] and [heater_bed] sections - See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types
## Leadscrew Rotation Distance          [stepper_z], [stepper_z1], [stepper_z2]
## Z Endstop Switch location            [safe_z_home] section
## Z Endstop Switch  offset for Z0      [stepper_z] section
## PID tune                             [extruder] and [heater_bed] sections
## Probe pin                            [probe] section
## Fine tune E steps                    [extruder] section

[include mainsail.cfg]
[include stealthburner_leds.cfg]
[include klicky-probe.cfg]
[include purge_line.cfg]
[include nozzle_scrub.cfg] 
[include bedfans.cfg]
#[include usb_adxl.cfg] # Uncomment this for input shaper tuning

[mcu]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_1F003D00115053424E363620-if00
restart_method: command
##--------------------------------------------------------------------

[printer]
kinematics: corexy
max_velocity: 600  
max_accel: 5500             #Max 4000
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0
minimum_cruise_ratio: 0.5

#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop connected to DIAG_0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 39.80569
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: PG6
position_min: 0
##--------------------------------------------------------------------

##  Uncomment below for 250mm build
position_endstop: 250
position_max: 250


##--------------------------------------------------------------------
homing_speed: 35   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_x]
uart_pin: PC4
interpolate: False
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 0

##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to DIAG_1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 39.75381
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: PG9
position_min: 0
##--------------------------------------------------------------------

##  Uncomment for 250mm build
position_endstop: 255
position_max: 257 # 257 is max! 258 hits hard stop

##--------------------------------------------------------------------
homing_speed: 35  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_y]
uart_pin: PD11
interpolate: False
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 0
 
#####################################################################
#   Z Stepper Settings
#####################################################################

##  Z0 Stepper - Front Left
##  Connected to MOTOR_2
##  Endstop connected to DIAG_2
[stepper_z]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
# Rotation Distance for TR8x8 = 8, TR8x4 = 4, TR8x2 = 2
rotation_distance: 4    
microsteps: 32
endstop_pin: PG10
#endstop_pin: probe:z_virtual_endstop  # for klicky as virtual endstop. Must comment out enstop_pin and position_endstop.
##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##  Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config

### BUILD PLATE SELECT WITH ENDSTOP ADJUSTMENT

position_endstop = -1.150 #voron textured build plate
#position_endstop = -1.300 # Kobra textured build plate
#position_endstop = -1.650 # micro texture build plate

## All builds use same Max Z
position_max: 250
position_min: -5.0
homing_speed: 8. # Leadscrews are slower than 2.4, 10 is a recommended max.
second_homing_speed: 2.0
homing_retract_dist: 5.0

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z]
uart_pin: PC6
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z1 Stepper - Rear Center
##  Connected to MOTOR_3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
# Rotation Distance for TR8x8 = 8, TR8x4 = 4, TR8x2 = 2
rotation_distance: 4  
microsteps: 32

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z2 Stepper - Front Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
# Rotation Distance for TR8x8 = 8, TR8x4 = 4, TR8x2 = 2
rotation_distance: 4  
microsteps: 32


##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z2]
uart_pin: PF2 #Connected to Motor_4
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
#   Extruder
#####################################################################

#   Connected to MOTOR_6
#   Heater - HE0
#   Thermistor - T0
[extruder]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PD4
##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.6789511 is a good starting point
#rotation_distance: 22.6789511   #Bondtech 5mm Drive Gears
#rotation_distance: 22.97239724 #finetuned distance with SB by TadasM.
rotation_distance: 5.7
##  Update Gear Ratio depending on your Extruder Type
##  Use 50:17 for Afterburner/Clockwork (BMG Gear Ratio)
##  Use 80:20 for M4, M3.1
#gear_ratio: 50:17               #BMG Gear Ratio
#gear_ratio: 50:10 #removed gearing that was made for SB by TadasM.
microsteps: 16 #changed for LGX extruder from 32 that was set to SB by TadasM.
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: PA2
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
#sensor_type: PT1000
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF4
min_temp: 10
max_temp: 310
max_power: 1.0
min_extrude_temp: 170
max_extrude_only_distance: 101.0
max_extrude_only_velocity: 400
#control = pid
#pid_kp = 26.213
#pid_ki = 1.304
#pid_kd = 131.721
##  Try to keep pressure_advance below 1.0
pressure_advance: 0.015  #using orca slicer with polymaker glitter abs and .6 noz at 260
##  Default is 0.040, leave stock
pressure_advance_smooth_time: 0.040

##  E0 on MOTOR6
##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 extruder]
uart_pin: PE1
interpolate: false
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
##  SSR Pin - HE1
##  Thermistor - TB
heater_pin: PA3
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for Keenovo heaters
sensor_type: Generic 3950
sensor_pin: PF3
##  Adjust Max Power so your heater doesn't warp your bed. Rule of thumb is 0.4 watts / cm^2 .  - not applicable to cast aluminum bed.
max_power: 1.0
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

#####################################################################
#   Chamber Thermistor
#####################################################################

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PF5
min_temp: 0
max_temp: 100
gcode_id: C

#####################################################################
#   Probe
#####################################################################

[probe]
##  Inductive Probe
##  This probe is not used for Z height, only Quad Gantry Leveling

# Select the probe port by type:
## For the PROBE port. Will not work with Diode. May need pull-up resistor from signal to 24V.
#pin: ~!PB7
## For the DIAG_7 port. NEEDS BAT85 DIODE! Change to !PG15 if probe is NO.
pin: PG15
## For Octopus Pro Probe port; NPN and PNP proximity switch types can be set by jumper
#pin: ~!PC5

#--------------------------------------------------------------------

x_offset: 0
y_offset: 25.0
z_offset = 0
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.1
samples_tolerance_retries: 3



[bed_mesh]
speed: 300
horizontal_move_z: 10
##--------------------------------------------------------------------
##	Uncomment below for 250mm build
mesh_min: 40, 40
mesh_max: 210,210
##--------------------------------------------------------------------
fade_start: 0.6
fade_end: 10.0
probe_count: 9,9
algorithm: bicubic
#relative_reference_index: 40   DEPRECIATED
zero_reference_position: 125, 125
move_check_distance: 3
split_delta_z: 0.0125
mesh_pps: 2,2



#####################################################################
#   Fan Control
#####################################################################

[fan]
##  Print Cooling Fan - FAN0
pin: PA8
kick_start_time: 0.5
##  Depending on your fan, you may need to increase this value
##  if your fan will not start. Can change cycle_time (increase)
##  if your fan is not able to slow down effectively
off_below: 0.10

[heater_fan hotend_fan]
##  Hotend Fan - FAN1
pin: PE5
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
##  If you are experiencing back flow, you can reduce fan_speed
#fan_speed: 1.0

[controller_fan controller_fan]
##  Controller fan - FAN2
pin: PD12
kick_start_time: 0.5
max_power: 0.2
heater: heater_bed


[fan_generic Nevermore]
pin:PD13
max_power:1.0
shutdown_speed: 0.0

# Moved to bedfans.cfg
#[fan_generic bed_fan]
#pin:PD15
#max_power:1.0
#shutdown_speed: 0.0

#[fan_generic exhaust_fan]
#pin:PD14
#max_power:1.0
#shutdown_speed: 0.0


#[temperature_sensor chamber_2]
#sensor_type: PT1000 #Generic 3950
#sensor_pin: PF7
#min_temp: 0
#max_temp: 100
#gcode_id: D

[temperature_fan chamberfan]
pin: PD14
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
cycle_time:0.01
off_below:0.1
sensor_type: PT1000
sensor_pin: PF7
min_temp: 0
max_temp: 70
target_temp: 55.0
control: watermark
gcode_id: D

#Add another section with a new macro.

#[gcode_macro M141]
#gcode:
   #{% set s = params.S|default(0)|float %}
   # SET_TEMPERATURE_FAN_TARGET temperature_fan="chamberfan" target={s}
    
 


#   See the "fan" section for a description of the above parameters.

#####################################################################
#   LED Control
#####################################################################

#[output_pin caselight]
# Chamber Lighting - HE2 Connector (Optional)
#pin: PB10
#pwm:true
#shutdown_value: 0
#value:1
#cycle_time: 0.01

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

#[safe_z_home] this is in klicky variables now
##  XY Location of the Z Endstop Switch
##  Update -10,-10 to the XY coordinates of your endstop pin 
##  (such as 157,305) after going through Z Endstop Pin
##  Location Definition step.
#home_xy_position:145,255
#speed:100
#z_hop:20

[z_tilt]
##  Use Z_TILT_ADJUST to level the bed .
##  z_positions: Location of toolhead

##--------------------------------------------------------------------
## Uncomment below for 250mm build
z_positions:
    -50, 18
    125, 298
    300, 18
points:
    30, 5
    125, 195
    220, 5

##--------------------------------------------------------------------

speed: 200
horizontal_move_z: 10
retries: 3
retry_tolerance: 0.02



#####################################################################
#   Macros
#####################################################################

[skew_correction]


[gcode_macro PRINT_START]
gcode:

    SKEW_PROFILE LOAD=Skew1
    
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
    {% set CHAMBER_TEMP_MIN = params.CHAMBER_TEMP_MIN|default(32)|float %}
    {% set CHAMBER_TEMP_MAX = params.CHAMBER_TEMP|default(55)|float %}



  

    M117 Heating & XY Home
    M140 S{ BED_TEMP }  #Not Wait for bed to reach temperature
    G28 X
    G28 Y; home x and y axes with a dirty nozzle
       SET_DISPLAY_TEXT MSG="Heating Hot End: {EXTRUDER_TEMP}C"
    M109 S{ EXTRUDER_TEMP }  ; Wait for nozzle to get to target temperature.


    STATUS_HOMING ; Cyan logo and white nozzle
    
    G28 Z; home z axis with a hot nozzle

    STATUS_LEVELING ; Pink logo and white nozzle
    M117 Z TILT adj.
    Z_TILT_ADJUST # z_tilt with a dirty nozzle
    
    G90                            ; absolute positioning    
    BED_MESH_PROFILE LOAD="default"



    ### Controled Heating
    #G0 X125 Y125 Z30 F3600 #Go to center for initial heating
    G0 X175 Y255 Z30 F3600 #Go to center of left bucket for initial heating

    
    # Start bed heating
    SET_DISPLAY_TEXT MSG="Heating Bed: {BED_TEMP}C"

    M190 S{ BED_TEMP } #Wait for bed to reach temperature
    

   
    ## Set and wait for chamber to reach temperature in slicer
    SET_DISPLAY_TEXT MSG="Heatsoak: {CHAMBER_TEMP_MIN}C"
     TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={CHAMBER_TEMP_MIN}

    ### end Controled Heating

    ### controlled cooling of the chamber
   
       SET_DISPLAY_TEXT MSG="CHAMBER TARGET TEMP: {CHAMBER_TEMP_MAX}C"
       SET_TEMPERATURE_FAN_TARGET temperature_fan="chamberfan" target={CHAMBER_TEMP_MAX}
    ###   
     
    M117 Cleaning nozzle
    STATUS_CLEANING
    CLEAN_NOZZLE

    G28 Z

    STATUS_PRINTING
    SET_FAN_SPEED FAN=Nevermore SPEED=.5
    M117 Purging
    PURGE_LINE

    M117 PRINTING
   

#--------------------------------------------------------------------

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:

    SET_FAN_SPEED FAN=Nevermore SPEED=1.0
   
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 12, th.axis_maximum.z]|min %}

    SET_SKEW CLEAR=1
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-2.0 F3600                 ; retract filament
    
    TURN_OFF_HEATERS
    
    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    
    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END

    G4P6000 #Dwell for 1 min so nevermore can filter chamber air then turn on the exhaust fan
    #SET_FAN_SPEED FAN=exhaust_fan SPEED=1.0
    
      {% set CHAMBER_TEMP_MIN = params.CHAMBER_TEMP_MIN|default(32)|float %}
       SET_DISPLAY_TEXT MSG="CHAMBER COOLDOWN: {CHAMBER_TEMP_MIN}C"
    
    #TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MAXIMUM={CHAMBER_TEMP_MIN+8}
    #TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MAXIMUM={45}
        
       {% set CHAMBER_TEMP_MIN = params.CHAMBER_TEMP_MIN|default(32)|float %}     
        SET_TEMPERATURE_FAN_TARGET temperature_fan="chamberfan" target={CHAMBER_TEMP_MIN}

    
    SET_FAN_SPEED FAN=Nevermore SPEED=0
    #SET_FAN_SPEED FAN=exhaust_fan SPEED=0 #not used anymore
    


[gcode_macro MAINT_POS]
  gcode:
        G0X125.Y0.Z240.


[gcode_macro M600]
gcode:
    #LCDRGB R=0 G=1 B=0  ; Turn LCD green
    PAUSE                ; Pause


######################################################################
# Multi Material Macros
######################################################################
[gcode_macro M900]
gcode:
    #default_parameter_K: 0 gcode : SET_PRESSURE_ADVANCE ADVANCE={K}

[gcode_macro T0]
gcode:
    ACTIVATE_EXTRUDER EXTRUDER=extruder
   

[gcode_macro T1]
gcode:
    ACTIVATE_EXTRUDER EXTRUDER=extruder

[gcode_macro SWAP_RESUME] 
gcode:
    {% set X = params.X|default(125)|float %}   # move x to position 50?
    {% set Y = params.Y|default(0)|float %}     # move y to position 0?
    {% set Z = params.Z|default(10)|float %}  # move z up incremental by 10
    SAVE_GCODE_STATE NAME=M600_state   # save the state of the print?
    PAUSE
    G91                                  #set coordinates to relative
    G1 E-.8 F2700                 # retract -.8 mm
    G1 Z{Z}                            # move to the defined z pos
    G90                                  # set coordinates to absolute
    G1 X{X} Y{Y} F3000        # move x/y to defined pos' @ 3000m/s
    G91                                  # set coordinates to relative
    G1 E-50 F1000             # retract -125mm 
    RESTORE_GCODE_STATE NAME=M600_state        #resume the print


[gcode_macro LOAD_FILAMENT]
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity %}
    SAVE_GCODE_STATE NAME=load_state
    ##M300 # beep
    G91
    G92 E0
    G1 E60 F{max_velocity} # fast-load
    G1 E50 F{speed} # purge
    ##M300
    ##M300
    RESTORE_GCODE_STATE NAME=load_state



[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity %}
    SAVE_GCODE_STATE NAME=unload_state
    G91
    ##M300 # beep
    G92 E0
    G1 E5 F{speed} # purge
    G1 E-100 F{max_velocity} # fast-unload
    ##M300
    ##M300
    RESTORE_GCODE_STATE NAME=unload_state

[exclude_object]

